name: CharlesTranslator
options:
  bundleIdPrefix: cz.cuni.mff.ufal
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CharlesTranslator:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CharlesTranslator
    info:
      path: CharlesTranslator/Info.plist
      properties:
        CFBundleDisplayName: Charles Translator
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Charles Translator uses the microphone to let you speak instead of type."
        NSSpeechRecognitionUsageDescription: "Speech recognition is used to convert your speech into text for translation."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.cuni.mff.ufal.translator.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
        DEVELOPMENT_TEAM: 8YW3ZU8MFU
        CODE_SIGN_IDENTITY: "iPhone Developer"

  CharlesTranslatorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CharlesTranslatorTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CharlesTranslator

schemes:
  CharlesTranslator:
    build:
      targets:
        CharlesTranslator: all
        CharlesTranslatorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CharlesTranslatorTests
